name: Bug report
description: Report a reproducible problem with the proxy.
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Do not include OAuth tokens, bearer tokens, credential files, or private request data.
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: e.g. 0.2.0 or abc1234
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      placeholder: Give the smallest redacted request and configuration needed to reproduce the issue.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and redacted logs
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I removed credentials and private data from this report.
          required: true
