services:
  openai-codex-oauth-proxy:
    build: .
    image: openai-codex-oauth-proxy:local
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: "8788"
      HOST: "0.0.0.0"
      CODEX_AUTH_FILE: /auth/auth.json
      CODEX_REFRESH_ENABLED: "true"
    ports:
      - "127.0.0.1:8092:8788"
    volumes:
      - ./auth:/auth
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8788/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
